name: PracticeLadder
version: 1.0.0
main: com.yourname.practiceladder.PracticeLadder
api-version: 1.20
commands:
  practice:
    description: Opens the practice menu
    usage: /practice
  queue:
    description: Queue for a ladder
    usage: /queue <ladder>
  duel:
    description: Challenge another player
    usage: /duel <player> <ladder>
  accept:
    description: Accept a duel request
    usage: /accept
  decline:
    description: Decline a duel request
    usage: /decline
  stats:
    description: View your stats
    usage: /stats
